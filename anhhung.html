<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anh Hùng Javascript</title>
<script src="anhhung.js" defer></script>
<style>
    body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-image: url("sieuanhhung.jpg@webp");
        background-repeat: repeat;
        background-size: 90px 90px;
        font-family: Arial, sans-serif;
        color: #00bfff;
        text-shadow: 2px 2px 4px #000;
    }

    main {
        max-width: 720px;
        margin: 24px;
        text-align: center;
    }

    h1 {
        margin-top: 0;
        color: #00bfff;
    }

    main p {
        font-size: 1.3rem;
        line-height: 1.6;
    }

    #battle-message {
        white-space: pre-line;
    }

    button {
        padding: 10px 18px;
        border: 1px solid #00bfff;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #00bfff;
        font-size: 1rem;
        cursor: pointer;
    }

    button:hover {
        background: rgba(0, 0, 0, 0.8);
    }

    select,
    input {
        margin: 6px;
        padding: 10px;
        border: 1px solid #00bfff;
        border-radius: 6px;
        font-size: 1rem;
    }
</style>
</head>
<body>
<main>
    <h1>Anh hùng JavaScript</h1>
    <p id="student-message">Tôi tên là Lâm Phú Cường – MSSV: 31241023888 sẽ quyết tâm trở thành 1 anh hùng JS.</p>
    <p id="hero-message"></p>
    <p id="level-message"></p>
    <p id="strength-message"></p>
    <p id="agility-message"></p>
    <p id="intel-message"></p>
    <p id="class-message"></p>
    <p id="memory-message"></p>
    <p id="level-up-message"></p>
    <label for="class-choice">Chọn phân cấp Anh Hùng:</label>
    <select id="class-choice">
        <option value="" selected disabled>-- Chọn phân cấp --</option>
        <option value="a">Chiến Binh</option>
        <option value="b">Sát Thủ</option>
        <option value="c">Thợ Săn</option>
    </select>
    <label for="hero-name-input">Nhập lại tên của bạn:</label>
    <input id="hero-name-input" type="text" autocomplete="off">
    <button id="quest-button" type="button">Chọn phân cấp Anh Hùng</button>
    <button id="battle-button" type="button" disabled>Bắt đầu chiến đấu với Rồng</button>
    <p id="battle-message"></p>
</main>
</body>
</html>
